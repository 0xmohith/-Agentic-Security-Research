<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff;
    font-family: Arial, sans-serif;
    color: #202124;
}

.container {
    width: 450px;
    max-width: calc(100% - 32px);
    margin: 100px auto 30px;
    padding: 42px 40px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -2px;
    margin-bottom: 18px;
}

.logo span:nth-child(1) { color: #4285F4; }
.logo span:nth-child(2) { color: #EA4335; }
.logo span:nth-child(3) { color: #FBBC05; }
.logo span:nth-child(4) { color: #4285F4; }
.logo span:nth-child(5) { color: #34A853; }
.logo span:nth-child(6) { color: #EA4335; }

h2 {
    font-size: 24px;
    font-weight: 400;
    margin: 10px 0;
}

.subtitle {
    font-size: 16px;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    font-size: 16px;
    margin-bottom: 20px;
}

input:focus {
    outline: 2px solid #4285F4;
    border-color: transparent;
}

button {
    background: #1a73e8;
    color: white;
    border: none;
    padding: 11px 25px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #1765cc;
}

.notice {
    margin-top: 28px;
    padding: 12px;
    background: #f8f9fa;
    border-radius: 5px;
    font-size: 12px;
    color: #5f6368;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #5f6368;
    margin-top: 20px;
}

@media(max-width: 500px) {
    .container {
        border: none;
        margin-top: 45px;
        padding: 30px 20px;
    }
}
</style>

</head>
<body>
    <div class="container">
        <div class="logo">
            <span>G</span><span>-</span><span>R</span><span>e</span><span>s</span><span>earch</span>
        </div>

        <h2>Welcome</h2>

        <p class="subtitle">
            Sign in to your Research Portal
        </p>

        <form onsubmit="
            event.preventDefault();
            document.getElementById('result').textContent =
            'Simulation completed. No credentials were collected.';
        ">

            <input
                type="email"
                placeholder="Enter email address"
                aria-label="Email address"
                required
            >

            <button type="submit">Continue</button>

        </form>

        <div id="result" class="notice">
            Authorized cybersecurity research simulation.
            This page does not collect or transmit credentials.
        </div>
    </div>
    <div class="footer">
        Research Simulation Environment | G-Research Portal
    </div>
    <div class="footer">
        Research Simulation Environment | G-Research Portal
    </div>


</body>
</html>
